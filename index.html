e{background:var(--dark);border-color:var(--dark);color:#fff}.wardrobe-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.item-card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;position:relative}.item-photo{aspect-ratio:1/1;background:#eff0eb;display:grid;place-items:center}.item-photo img{height:94%;width:94%;object-fit:contain}.item-details{padding:10px 12px}.item-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-meta{font-size:11px;color:var(--sub);margin-top:4px}.delete-item{position:absolute;right:8px;top:8px;background:#fffc;border:0;border-radius:50%;width:27px;height:27px;display:grid;place-items:center;color:#84574a}.stat{padding:18px;background:#f1f2eb;border-radius:17px;flex:1;text-align:center}.stat strong{display:block;font-size:25px}.stat span{font-size:11px;color:var(--sub)}.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-row.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:700;color:#686f62}.field input,.field select{width:100%;min-width:0;height:44px;border:1px solid #dedfd7;background:white;border-radius:10px;padding:0 11px;color:#30352d}.field input[type="range"]{padding:0;height:32px;accent-color:#596d52}.upload-zone{border:2px dashed #bbc5b3;border-radius:17px;background:#f0f3ed;padding:27px 10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;cursor:pointer;color:#526348}.upload-zone input{display:none}.preview-portrait{border-radius:19px;width:100%;min-height:320px;max-height:390px;object-fit:cover;background:#dce2d7}.preview-layout{display:grid;grid-template-columns:1fr .8fr;gap:28px}.canvas-wrap{width:100%;max-width:470px;aspect-ratio:2/3;border-radius:22px;overflow:hidden;background:#e5e7df;box-shadow:0 15px 45px rgba(47,55,43,.10);margin:auto;position:relative;touch-action:none}.canvas-wrap canvas{width:100%;height:100%;display:block;touch-action:none}.preview-tools{display:flex;flex-direction:column;gap:14px}.switches{display:flex;gap:7px;flex-wrap:wrap}.switches button{background:#f4f4ef;border:1px solid #dce0d7;border-radius:9px;padding:8px 10px;font-size:12px}.switches button.active{background:var(--dark);color:#fff;border-color:var(--dark)}.notice{border-left:3px solid #c5a777;background:#f8f3e9;padding:11px 14px;border-radius:6px 12px 12px 6px;font-size:12px;color:#77684e}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.step{padding:17px;background:#fff;border-radius:16px;border:1px solid var(--line)}.step b{font-size:25px;font-family:Georgia,serif;color:#96a28e}.step strong{display:block;font-size:14px;margin:5px 0}.step span{font-size:12px;color:var(--sub)}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(100px);transition:transform .25s;background:#354438;color:#fff;padding:13px 20px;border-radius:15px;z-index:100;max-width:90vw;box-shadow:var(--shadow);font-size:13px}.toast.show{transform:translateX(-50%) translateY(0)}.footer{max-width:1200px;margin:auto;padding:28px 25px 100px;font-size:11px;color:var(--sub);border-top:1px solid var(--line)}.mobile-nav{display:none}.loading{opacity:.6;pointer-events:none}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.swatch{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;border:1px solid #aaa4}
    @media(max-width:900px){.two,.hero,.preview-layout{grid-template-columns:1fr}.wardrobe-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero-visual{min-height:260px}.hero-visual img{height:190px}.main{padding:20px}.topnav{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fffefbf3;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.mobile-nav button{border:0;background:none;color:#7e827a;display:flex;flex-direction:column;align-items:center;font-size:10px;gap:3px;min-width:63px}.mobile-nav button span{font-size:19px}.mobile-nav button.active{color:var(--accent);font-weight:800}}
    @media(max-width:600px){main{padding:23px 15px 100px}.nav-wrap{padding:12px 16px}.brand-name{font-size:17px}.brand-sub{font-size:9px}.header-action{padding:9px 11px}.heading{font-size:35px}.weatherbar{grid-template-columns:1fr;gap:10px}.day-strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:7px;margin-right:-15px}.day-card{min-width:135px;scroll-snap-align:start}.wardrobe-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.padded{padding:17px}.form-row,.form-row.three{grid-template-columns:repeat(2,minmax(0,1fr))}.outfit-grid{gap:7px}.photo-tile{padding:7px}.photo-tile .name{font-size:11px}.section{margin-top:26px}.steps{grid-template-columns:1fr}.preview-portrait{min-height:250px}}

<body>
<header><div class="nav-wrap"><div class="brand" data-action="tab" data-tab="today"><div class="brand-icon">✳</div><div><div class="brand-name">每日穿搭</div><div class="brand-sub">EVERYDAY, YOUR WAY</div></div></div><nav class="topnav" id="topnav"></nav><button class="header-action" data-action="tab" data-tab="closet">＋ 添加衣物</button></div></header>
<main id="app"><div class="panel padded">正在准备你的私人衣橱…</div></main><div class="mobile-nav" id="mobileNav"></div><footer class="footer">每日穿搭 · 您的照片与身形数据保存在当前浏览器的设备存储中，不会上传至我们的服务器。真实天气由 Open-Meteo 提供；示例天气会明确标注。请定期导出备份。</footer><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const tabs=[['today','今日穿搭','☀'],['five','五天计划','▦'],['closet','我的衣橱','▣'],['profile','我的身形','♡'],['preview','试穿效果','✦']];
const CAT={top:'上装',bottom:'下装',shoes:'鞋子',outer:'外套'};
const categoryOptions=Object.entries(CAT).map(([id,label])=>`<option value="${id}">${label}</option>`).join('');
const cols={白色:'#eeeae0',黑色:'#2e3331',灰色:'#969994',米色:'#d5c7ac',棕色:'#806149',酒红:'#81394c',蓝色:'#57748a',绿色:'#6c8064',黄色:'#d6ad50',粉色:'#c98790',紫色:'#81617d',其他:'#a5a5a5'};
let state={tab:'today',selectedDay:0,filter:'all',profile:{city:'',height:'',weight:'',chest:'',waist:'',hips:'',photo:'',style:'日常'},wardrobe:[],weather:{days:[],city:'',source:'none'},plan:[],planError:'',planSeed:0,manual:{max:24,min:15,rain:10},preview:{layer:'top',removeBg:true,layout:{top:{x:50,y:37,scale:100},bottom:{x:50,y:68,scale:100},shoes:{x:50,y:91,scale:100},outer:{x:50,y:39,scale:100}}}};
let db=null, saveTimer=null, imageCache=new Map(), renderCount=0, draggable=false, toastTimer;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayLabel=(date,i)=> i===0?'今天':i===1?'明天':new Date(date+'T12:00:00').toLocaleDateString('zh-CN',{weekday:'short'});
function localDate(offset=0){const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function sampleForecast(){const deltas=[0,-1,2,-2,1];const max=Number(state.manual.max)||24,min=Number(state.manual.min)||15,rain=Number(state.manual.rain)||0;return deltas.map((d,i)=>({date:localDate(i),max:max+d,min:min+d,rain:i===2?Math.min(100,rain+20):rain,code:(i===2&&rain>25)?61:(i%2?3:1),desc:i===2&&rain>25?'小雨':i%2?'多云':'晴'}))}
function ensureWeather(){if(!state.weather?.days?.length||state.weather.days[0].date!==localDate(0)){state.weather={city:state.profile.city||'未设置城市',source:'sample',days:sampleForecast()}}}
function codeWeather(code){if(code===0)return ['晴','☀️'];if(code<=3)return ['多云','⛅'];if([45,48].includes(code))return ['雾','🌫️'];if(code>=95)return ['雷雨','⛈️'];if(code>=71&&code<=86)return ['雪','❄️'];if(code>=51)return ['雨','🌧️'];return ['多云','⛅']}
function wicon(d){return codeWeather(d.code)[1]}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3300)}
function loadDb(){return new Promise(resolve=>{try{const req=indexedDB.open('daily-outfit-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('kv');req.onsuccess=()=>{db=req.result;const tx=db.transaction('kv','readonly');const q=tx.objectStore('kv').get('state');q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>resolve(null)};req.onerror=()=>resolve(null)}catch(e){resolve(null)}})}
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const value=JSON.parse(JSON.stringify({...state,tab:'today',filter:'all'}));
    if(db){
      try {db.transaction('kv','readwrite').objectStore('kv').put(value,'state')}
      catch(e){toast('设备存储不足，建议先导出备份')}
    }else{
      try {localStorage.setItem('daily-outfit-v1',JSON.stringify(value))}
      catch(e){toast('设备存储不足，建议先导出备份')}
    }
  },260);
}
function colorPoint(a,b){const c1=a.color,c2=b.color;if(c1===c2)return c1==='黑色'||c1==='白色'?1.4:.4;let neutral=['黑色','白色','灰色','米色','棕色'];if(neutral.includes(c1)||neutral.includes(c2))return 2;const pairs=[['酒红','绿色'],['酒红','蓝色'],['蓝色','黄色'],['绿色','米色'],['紫色','粉色']];return pairs.some(([x,y])=>[c1,c2].includes(x)&&[c1,c2].includes(y))?1.6:0.7}
function wantedWarmth(t,cat){if(cat==='shoes')return t<10?5:t<18?3.7:t<25?2.6:1.4;if(cat==='bottom')return t<9?5:t<16?4:t<23?3:t<29?2:1;return t<8?5:t<15?4.5:t<21?3:t<27?2:1}
function expectedSeason(d){
 const avg=(d.max+d.min)/2,month=Number(d.date.split('-')[1]);
 if(avg<10)return '冬季';if(avg>27)return '夏季';
 return [3,4,5].includes(month)?'春秋':[9,10,11].includes(month)?'春秋':([6,7,8].includes(month)?'夏季':'冬季');
}
function stableJitter(id,day){
 const key=id+'|'+day+'|'+(state.planSeed||0);let hash=17;
 for(let i=0;i<key.length;i++)hash=(Math.imul(hash,31)+key.charCodeAt(i))|0;
 return ((hash>>>0)%1000)/1000*2;
}
function itemScore(item,d,cat){const avg=(d.max+d.min)/2;let score=8-Math.abs(Number(item.warmth||3)-wantedWarmth(avg,cat))*2.8;if((item.style||'日常')===state.profile.style)score+=2;if(item.style==='百搭')score+=1.5;if(d.rain>55)score+=(item.waterproof?2.5:cat==='shoes'?-3:0);if(d.min<10&&cat==='shoes'&&item.warmth<3)score-=3;if(d.max>28&&item.warmth>=4)score-=3;if(item.season&&item.season!=='四季'&&item.season!==expectedSeason(d))score-=3.5;return score}
function makePlan(){ensureWeather();const categories=['top','bottom','shoes'];const required=Object.fromEntries(categories.map(c=>[c,state.wardrobe.filter(it=>it.category===c).length]));state.planError='';const used=new Set(),plan=[];for(let i=0;i<5;i++){
 const d=state.weather.days[i]||sampleForecast()[i], available=Object.fromEntries(categories.map(c=>[c,state.wardrobe.filter(it=>it.category===c&&!used.has(it.id))]));
 if(categories.some(c=>!available[c].length)){plan.push(null);continue}
 let best=null,bestScore=-Infinity;
 // Try all three-way combinations for the best weather fit with no repeated pieces.
 for(const a of available.top)for(const b of available.bottom)for(const c of available.shoes){let s=itemScore(a,d,'top')+itemScore(b,d,'bottom')+itemScore(c,d,'shoes')+colorPoint(a,b)+colorPoint(b,c)+stableJitter(a.id,i)+stableJitter(b.id,i)+stableJitter(c.id,i);if(s>bestScore){bestScore=s;best={top:a.id,bottom:b.id,shoes:c.id}}}
 if(best){for(const id of Object.values(best))used.add(id);const avg=(d.max+d.min)/2,outerAvail=state.wardrobe.filter(it=>it.category==='outer'&&!used.has(it.id));if((avg<13||d.min<9)&&outerAvail.length){outerAvail.sort((a,b)=>itemScore(b,d,'top')-itemScore(a,d,'top'));best.outer=outerAvail[0].id;used.add(best.outer)}plan.push(best)}else plan.push(null);
 }state.plan=plan;if(plan.some(x=>!x)){const misses=categories.filter(c=>required[c]<5).map(c=>`${CAT[c]}还差${5-required[c]}件`);state.planError=misses.length?`想做到五天所有上装、下装、鞋子都不重复：${misses.join('、')}。`:'需要补充衣物才能生成完整计划。'}
}
function findItem(id){return state.wardrobe.find(x=>x.id===id)}
function currentLook(){return state.plan[state.selectedDay]||null}
function pic(item){return item?`<img src="${item.image}" alt="${escapeHTML(item.name)}">`:'<span style="font-size:34px">＋</span>'}
function btn(action,label,variant='',extra=''){return `<button class="btn ${variant}" data-action="${action}" ${extra}>${label}</button>`}
function renderNav(){const desktop=$('#topnav'),mobile=$('#mobileNav');desktop.innerHTML=tabs.map(([id,lab])=>`<button class="nav-btn ${state.tab===id?'active':''}" data-action="tab" data-tab="${id}">${lab}</button>`).join('');mobile.innerHTML=tabs.map(([id,lab,ico])=>`<button class="${state.tab===id?'active':''}" data-action="tab" data-tab="${id}"><span>${ico}</span>${lab}</button>`).join('')}
function headerSection(kicker,title,desc){return `<div class="kicker">${kicker}</div><h1 class="heading">${title}</h1>${desc?`<div class="lead">${desc}</div>`:''}`}
function renderWeatherPanel(){const d=state.weather.days[0],isSample=state.weather.source!=='real';return `<div class="weatherbar"><div class="flex" style="gap:16px"><div style="font-size:39px">${wicon(d)}</div><div><div class="flex wrap"><b>${escapeHTML(state.weather.city||'未设置城市')}</b><span class="badge">${isSample?'演示天气 · 非实时':'实时预报 · Open-Meteo'}</span></div><div class="flex" style="margin-top:3px"><span class="weather-temp">${d.max}° / ${d.min}°</span><span class="muted tiny">${escapeHTML(d.desc||codeWeather(d.code)[0])} · 降雨 ${d.rain??0}%</span></div></div></div><div class="flex wrap"><input id="cityQuick" value="${escapeHTML(state.profile.city||'')}" placeholder="输入城市，例如：合肥" aria-label="城市名称" style="max-width:145px;height:37px;padding:0 10px;border:1px solid #d8ddd4;border-radius:10px;background:#fff">${btn('weather','获取天气','small')}${btn('geolocate','⌖ 定位','outline small')}</div></div>`}
function outfitTile(item,label){return `<div class="photo-tile"><div class="tiny muted">${label}</div>${pic(item)}<div class="name">${escapeHTML(item?.name||'待添加')}</div></div>`}
function renderDayStrip(){return `<div class="day-strip">${state.weather.days.slice(0,5).map((d,i)=>`<button class="day-card ${state.selectedDay===i?'active':''}" data-action="day" data-day="${i}"><div class="date">${dayLabel(d.date,i)} <span class="muted tiny">${d.date.slice(5).replace('-','/')}</span></div><span class="wicon">${wicon(d)}</span><div class="forecast">${d.max}° / ${d.min}°</div><div class="pill ${state.plan[i]?'done':'warn'}">${state.plan[i]?'✓ 搭配已就绪':'＋ 待补充衣物'}</div></button>`).join('')}</div>`}
function reasonFor(look,d){if(!look)return '补齐衣橱里的单品后，就能依据天气安排不重复的搭配。';let all=[look.top,look.bottom,look.shoes].map(findItem);const temp=(d.max+d.min)/2;const label=temp<12?'气温较低，建议以保暖为主':temp>27?'天气偏热，优先选轻薄透气的衣物':'温度适中，兼顾舒适与层次';return `${label}${d.rain>45?'；降雨概率偏高，出门建议带伞并注意防滑':''}${d.min<9&&!look.outer?'；早晚较冷，建议补充合适的保暖外套':''}。这套从你的衣橱选出：${all.map(x=>x?.name).join('、')}，连续五天不重复使用主单品。`}

lass="panel padded"><h3 class="horizontal-title">衣橱概览</h3><div class="flex" style="margin-bottom:10px"><div class="stat"><strong>${state.wardrobe.length}</strong><span>全部单品</span></div><div class="stat"><strong>${Math.min(5,...['top','bottom','shoes'].map(count))}</strong><span>可不重复穿搭天数</span></div></div>${['top','bottom','shoes','outer'].map(c=>`<div class="flex space" style="padding:11px 0;border-bottom:1px solid #eceee8"><span>${CAT[c]}</span><b>${count(c)} 件</b></div>`).join('')}<p class="notice" style="margin-top:17px">五天上装、下装、鞋子不重复，至少需要各 5 件。外套也会尽量不重复。</p><div class="flex wrap">${btn('demo','＋ 加入演示衣橱','outline small')}${btn('clear-demo','删除演示单品','ghost small')}</div></div></div><div class="section flex space wrap"><h2 class="section-title">我的全部单品</h2><div class="closet-filters">${[['all','全部'],...Object.entries(CAT)].map(([c,t])=>`<button data-action="filter" data-filter="${c}" class="filter ${state.filter===c?'active':''}">${t}</button>`).join('')}</div></div>${items.length?`<div class="wardrobe-grid">${items.map(item=>`<div class="item-card"><button class="delete-item" title="删除这件衣物" aria-label="删除${escapeHTML(item.name)}" data-action="delete-item" data-id="${item.id}">×</button><div class="item-photo">${pic(item)}</div><div class="item-details"><div class="item-name">${escapeHTML(item.name)}</div><div class="item-meta"><span class="swatch" style="background:${cols[item.color]||'#bbb'}"></span>${escapeHTML(item.color||'其他')} · ${CAT[item.category]} · ${item.season||'四季'} · ${item.warmth}级</div></div></div>`).join('')}</div>`:`<div class="noitem"><div class="bigicon">🧺</div><h3>这里还没有衣物</h3><p class="muted">拍下你的第一件衣服，开启专属衣橱。</p></div>`}`}

function changeTab(t){state.tab=t;window.scrollTo({top:0,behavior:'instant'});render();persist()}
function addDemo(){if(state.wardrobe.some(x=>x.demo)){toast('演示衣橱已经添加过了');return}const sets={top:[['奶油白衬衫','白色',2,'通勤'],['酒红针织衫','酒红',4,'约会'],['橄榄绿T恤','绿色',1,'日常'],['蓝色宽松衬衫','蓝色',2,'百搭'],['咖色套头毛衣','棕色',5,'日常']],bottom:[['浅卡其阔腿裤','米色',3,'通勤'],['深灰西装裤','灰色',3,'百搭'],['蓝色牛仔裤','蓝色',4,'日常'],['米白直筒裤','白色',2,'约会'],['黑色半裙','黑色',3,'通勤']],shoes:[['酒红短靴','酒红',4,'约会'],['黑色乐福鞋','黑色',3,'通勤'],['白色运动鞋','白色',2,'日常'],['棕色皮鞋','棕色',4,'百搭'],['灰色休闲鞋','灰色',2,'日常']],outer:[['驼色风衣','米色',3,'通勤'],['深绿大衣','绿色',5,'约会'],['米白短外套','白色',3,'日常'],['棕色夹克','棕色',4,'百搭'],['灰色大衣','灰色',5,'通勤']]};for(const [category,items] of Object.entries(sets))for(const [name,color,warmth,style] of items){state.wardrobe.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),category,name,color,warmth,style,image:demoSVG(category,cols[color]),waterproof:category==='shoes'&&warmth>3,demo:true})}toast('已导入 20 件演示单品，可试用五天搭配');render();persist()}
function demoSVG(cat,color){const stroke='#55584d',p={top:`<path d="M130 65 L161 49 Q180 76 200 77 Q220 76 239 49 L270 65 L331 128 L284 164 L266 144 L265 311 L135 311 L134 144 L116 164 L69 128 Z" fill="${color}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/><path d="M162 50 Q200 118 238 50" fill="none" stroke="${stroke}" stroke-width="3"/>`,bottom:`<path d="M116 46 L284 46 L300 152 L273 338 L224 338 L201 178 L178 338 L126 338 L100 152 Z" fill="${color}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/><path d="M115 85 L285 85 M200 88 L200 178" stroke="${stroke}" stroke-width="3" fill="none"/>`,shoes:`<path d="M33 225 L75 151 L126 154 L159 222 Q185 245 195 257 L194 290 L25 290 Q14 273 33 225 Z M203 225 L245 151 L296 154 L329 222 Q355 245 365 257 L364 290 L195 290 Q184 273 203 225 Z" fill="${color}" stroke="${stroke}" stroke-width="4"/><path d="M32 267 L190 267 M202 267 L362 267" stroke="white" stroke-width="7" opacity=".6"/>`,outer:`<path d="M131 46 L176 28 L201 81 L224 28 L269 46 L319 121 L287 143 L268 122 L282 348 L118 348 L132 122 L113 143 L81 121 Z" fill="${color}" stroke="${stroke}" stroke-width="4"/><path d="M176 29 L201 82 L225 29 L240 130 L202 350 L162 130 Z" fill="#ffffff" opacity=".33"/><path d="M200 83 L200 348" stroke="${stroke}" stroke-width="3"/><circle cx="212" cy="175" r="4" fill="${stroke}"/><circle cx="212" cy="215" r="4" fill="${stroke}"/>`};return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">${p[cat]}</svg>`)}`}
function compress(file,limit=1000){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(new Error('请上传图片文件'));const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onload=()=>{const ratio=Math.min(1,limit/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.79))};img.onerror=()=>reject(new Error('图片无法读取'));img.src=reader.result};reader.readAsDataURL(file)})}
async function fetchWeather(city,useLoc=false){let coords=null,name=city;try{if(useLoc){if(!navigator.geolocation)throw Error('浏览器不支持定位');coords=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(p=>resolve([p.coords.latitude,p.coords.longitude]),reject,{enableHighAccuracy:false,timeout:10000}));name='当前位置'}else{if(!city?.trim())throw Error('请先输入城市名称');const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city.trim())}&count=1&language=zh&format=json`);if(!r.ok)throw Error('城市查询失败');const j=await r.json();if(!j.results?.length)throw Error('找不到该城市，请尝试拼音或英文城市名');coords=[j.results[0].latitude,j.results[0].longitude];name=j.results[0].name}const u=`https://api.open-meteo.com/v1/forecast?latitude=${coords[0]}&longitude=${coords[1]}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=5`;const res=await fetch(u);if(!res.ok)throw Error('天气服务暂不可用');const json=await res.json(),d=json.daily;if(!d?.time?.length)throw Error('天气数据为空');state.weather={source:'real',city:name,days:d.time.map((date,i)=>({date,max:Math.round(d.temperature_2m_max[i]),min:Math.round(d.temperature_2m_min[i]),rain:Math.round(d.precipitation_probability_max[i]||0),code:d.weather_code[i],desc:codeWeather(d.weather_code[i])[0]}))};state.profile.city=useLoc?(state.profile.city||''):city.trim();state.selectedDay=0;toast('已获取未来五天真实天气');render();persist()}catch(e){toast('无法获取天气：'+e.message+'。仍可使用手动示例天气。')}}
function safeExport(){const data={format:'meiri-chuanda',version:1,exportedAt:new Date().toISOString(),profile:state.profile,wardrobe:state.wardrobe,manual:state.manual};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='每日穿搭-我的衣橱-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);toast('衣橱备份已导出，请妥善保存')}
function resetPreview(){state.preview.layout={top:{x:50,y:37,scale:100},bottom:{x:50,y:68,scale:100},shoes:{x:50,y:91,scale:100},outer:{x:50,y:39,scale:100}};state.preview.layer='top';render();persist()}
function loadImage(url){if(!url)return Promise.resolve(null);if(imageCache.has(url))return imageCache.get(url);const p=new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=url});imageCache.set(url,p);if(imageCache.size>80)imageCache.delete(imageCache.keys().next().value);return p}
function transformClothImage(img){if(!state.preview.removeBg||img.src.startsWith('data:image/svg'))return img;const w=img.naturalWidth,h=img.naturalHeight;if(w<4||h<4)return img;const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);let image;try{image=ctx.getImageData(0,0,w,h)}catch(e){return img}const data=image.data;const idx=(x,y)=>4*(y*w+x);const corners=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]];let bg=[0,0,0];for(const [x,y] of corners)for(let c=0;c<3;c++)bg[c]+=data[idx(x,y)+c]/4;const variance=corners.reduce((a,[x,y])=>a+Math.hypot(...bg.map((v,c)=>v-data[idx(x,y)+c])),0)/4;if(variance>42)return img;const tolerance=41, visited=new Uint8Array(w*h),queue=[];for(let x=0;x<w;x++){queue.push(x,(h-1)*w+x)}for(let y=0;y<h;y++){queue.push(y*w,y*w+w-1)}let head=0;while(head<queue.length){const p=queue[head++];if(visited[p])continue;visited[p]=1;const a=p*4,dist=Math.hypot(data[a]-bg[0],data[a+1]-bg[1],data[a+2]-bg[2]);if(dist>tolerance)continue;data[a+3]=0;const x=p%w,y=(p-x)/w;if(x>0&&!visited[p-1])queue.push(p-1);if(x<w-1&&!visited[p+1])queue.push(p+1);if(y>0&&!visited[p-w])queue.push(p-w);if(y<h-1&&!visited[p+w])queue.push(p+w)}ctx.putImageData(image,0,0);return canvas}
function cover(ctx,img,W,H){const scale=Math.max(W/img.width,H/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h)}
function drawMannequin(ctx,W,H){const grd=ctx.createLinearGradient(0,0,W,H);grd.addColorStop(0,'#e7ebe0');grd.addColorStop(1,'#d2dacb');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.save();ctx.fillStyle='#b5bfb0';ctx.beginPath();ctx.ellipse(W*.5,H*.18,W*.092,H*.079,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(W*.42,H*.27);ctx.quadraticCurveTo(W*.3,H*.27,W*.3,H*.37);ctx.lineTo(W*.36,H*.56);ctx.lineTo(W*.42,H*.56);ctx.lineTo(W*.4,H*.85);ctx.lineTo(W*.47,H*.85);ctx.lineTo(W*.5,H*.6);ctx.lineTo(W*.53,H*.85);ctx.lineTo(W*.6,H*.85);ctx.lineTo(W*.58,H*.56);ctx.lineTo(W*.64,H*.56);ctx.lineTo(W*.7,H*.37);ctx.quadraticCurveTo(W*.7,H*.27,W*.58,H*.27);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle='#889585';ctx.font='19px sans-serif';ctx.textAlign='center';ctx.fillText('上传正面全身照，预览你自己的效果',W/2,H-28)}
function clothArea(cat,W,H){
 const values={top:[.55,.31],bottom:[.54,.42],shoes:[.57,.19],outer:[.63,.43]}[cat];
 // Gentle size hints only. Measurements cannot infer pose or actual garment fit.
 const chest=Number(state.profile.chest)||90,hips=Number(state.profile.hips)||95,height=Number(state.profile.height)||165;
 const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
 const widthScale=cat==='top'||cat==='outer'?clamp(chest/90,.84,1.16):cat==='bottom'?clamp(hips/95,.84,1.16):1;
 const heightScale=cat==='top'||cat==='bottom'||cat==='outer'?clamp(height/165,.91,1.09):1;
 return [W*values[0]*widthScale,H*values[1]*heightScale]
}
async function drawTryon(){const canvas=$('#tryonCanvas');if(!canvas)return;const context=canvas.getContext('2d'),W=canvas.width,H=canvas.height,token=++renderCount;context.clearRect(0,0,W,H);const photo=await loadImage(state.profile.photo);if(token!==renderCount)return;if(photo)cover(context,photo,W,H);else drawMannequin(context,W,H);const look=currentLook();if(!look)return;for(const cat of ['shoes','bottom','top','outer']){const item=findItem(look[cat]);if(!item)continue;const image=await loadImage(item.image);if(token!==renderCount)return;if(!image)continue;const use=transformClothImage(image),layout=state.preview.layout[cat],size=clothArea(cat,W,H),scale=layout.scale/100;context.save();context.globalAlpha=photo?.94:1;context.drawImage(use,W*layout.x/100-size[0]*scale/2,H*layout.y/100-size[1]*scale/2,size[0]*scale,size[1]*scale);context.restore()}}
function installCanvas(){const canvas=$('#tryonCanvas');if(!canvas)return;const move=(ev)=>{if(!draggable)return;ev.preventDefault();const bounds=canvas.getBoundingClientRect(),pos=state.preview.layout[state.preview.layer];pos.x=Math.max(5,Math.min(95,Math.round((ev.clientX-bounds.left)/bounds.width*100)));pos.y=Math.max(5,Math.min(98,Math.round((ev.clientY-bounds.top)/bounds.height*100)));['x','y'].forEach(a=>{const el=$('#pos'+a);if(el)el.value=pos[a];const label=$('#pos'+a+'Display');if(label)label.textContent=pos[a]+'%'});drawTryon()};canvas.addEventListener('pointerdown',ev=>{if(!currentLook())return;draggable=true;canvas.setPointerCapture(ev.pointerId);move(ev)});canvas.addEventListener('pointermove',move);const stop=()=>{if(draggable){draggable=false;persist()}};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop)}
// Delegate button interactions so the app remains responsive after re-rendering.
document.addEventListener('click',async event=>{const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;switch(action){
 case 'tab':changeTab(target.dataset.tab);break;
 case 'day':state.selectedDay=Number(target.dataset.day);render();persist();break;
 case 'preview-day':state.selectedDay=Number(target.dataset.day);changeTab('preview');break;
 case 'filter':state.filter=target.dataset.filter;render();break;
 case 'regenerate':state.planSeed=(state.planSeed||0)+1;render();persist();toast('已重新生成方案，五天主单品仍不重复');break;
 case 'weather':await fetchWeather($('#cityQuick')?.value||state.profile.city);break;
 case 'geolocate':await fetchWeather('',true);break;
 case 'demo':addDemo();break;
 case 'clear-demo':if(!state.wardrobe.some(x=>x.demo)){toast('没有演示单品');break}if(confirm('删除演示衣橱的所有单品？')){state.wardrobe=state.wardrobe.filter(x=>!x.demo);render();persist()}break;
 case 'delete-item':if(confirm('确认删除这件衣物吗？')){state.wardrobe=state.wardrobe.filter(x=>x.id!==target.dataset.id);render();persist()}break;
 case 'delete-profile-photo':if(confirm('移除你的试穿照片？')){state.profile.photo='';render();persist()}break;
 case 'layer':state.preview.layer=target.dataset.layer;render();persist();break;
 case 'reset-preview':resetPreview();break;
 case 'download-preview':{const canvas=$('#tryonCanvas');if(!canvas)return;await drawTryon();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='每日穿搭-试穿示意-'+localDate()+'.png';a.click();toast('试穿示意图已保存');break}
 case 'export':safeExport();break;
 case 'clear-all':if(confirm('确定清空所有衣物、照片、身形资料吗？该操作无法撤销，请先导出备份。')){state.wardrobe=[];state.profile={city:'',height:'',weight:'',chest:'',waist:'',hips:'',photo:'',style:'日常'};state.weather={source:'sample',city:'未设置城市',days:sampleForecast()};state.selectedDay=0;imageCache.clear();render();persist();toast('数据已清空')}break;
 }});
document.addEventListener('submit',async ev=>{const form=ev.target;if(!['addForm','profileForm','manualWeather'].includes(form.id))return;ev.preventDefault();const values=Object.fromEntries(new FormData(form));if(form.id==='addForm'){const f=form.querySelector('[name=garmentPhoto]').files?.[0];if(!f){toast('请先为衣物拍照或上传图片');return}try{const image=await compress(f,850);state.wardrobe.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name:values.name.trim(),category:values.category,color:values.color,warmth:Number(values.warmth),style:values.style,season:values.season,waterproof:values.waterproof==='1',image,demo:false});imageCache.clear();toast('衣物已加入你的私人衣橱');render();persist()}catch(e){toast('衣服图片读取失败：'+e.message)}}else if(form.id==='profileForm'){for(const k of ['height','weight','chest','waist','hips','city','style'])state.profile[k]=(values[k]||'').toString().trim();toast('身形与穿搭偏好已保存');render();persist()}else{const max=Number(values.max),min=Number(values.min),rain=Number(values.rain);if(min>max){toast('最低温不能高于最高温');return}state.manual={max,min,rain};state.weather={source:'sample',city:state.profile.city||'手动设置',days:sampleForecast()};state.selectedDay=0;toast('已使用手动示例天气');render();persist()}});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.name==='garmentPhoto'&&el.files?.length){$('#garmentUploadText').textContent=el.files[0].name;const pic=$('#garmentPreview');pic.src=URL.createObjectURL(el.files[0]);pic.style.display='block'}else if(el.id==='bodyPhotoInput'&&el.files?.length){try{state.profile.photo=await compress(el.files[0],1350);toast('全身照上传成功，可在试穿页查看');render();persist()}catch(e){toast('图片读取失败：'+e.message)}}else if(el.id==='removeBg'){state.preview.removeBg=el.checked;drawTryon();persist()}else if(el.id==='importInput'&&el.files?.length){try{const raw=await el.files[0].text(),data=JSON.parse(raw);if(data.format!=='meiri-chuanda'||!Array.isArray(data.wardrobe)||!data.profile||data.wardrobe.length>2000)throw Error('文件不是有效的每日穿搭备份');if(!confirm('导入备份将覆盖当前衣橱和个人资料，确定继续吗？'))return;state.wardrobe=data.wardrobe.filter(x=>CAT[x.category]&&typeof x.image==='string'&&x.image.startsWith('data:image/'));state.profile={...state.profile,...data.profile};state.manual=data.manual||state.manual;state.weather={source:'sample',city:state.profile.city||'未设置城市',days:sampleForecast()};state.selectedDay=0;imageCache.clear();render();persist();toast('备份导入成功')}catch(e){toast('备份导入失败：'+e.message)}}});
document.addEventListener('input',ev=>{if(!['posx','posy','scale'].includes(ev.target.id))return;const pos=state.preview.layout[state.preview.layer];const k=ev.target.id==='posx'?'x':ev.target.id==='posy'?'y':'scale';pos[k]=Number(ev.target.value);const disp=$('#'+ev.target.id+'Display');if(disp)disp.textContent=pos[k]+'%';drawTryon();persist()});
(async function boot(){const saved=await loadDb();if(saved){state={...state,...saved,preview:{...state.preview,...saved.preview,layout:{...state.preview.layout,...saved.preview?.layout}},profile:{...state.profile,...saved.profile}}}else{try{const raw=localStorage.getItem('daily-outfit-v1');if(raw){const val=JSON.parse(raw);state={...state,...val,profile:{...state.profile,...val.profile}}}}catch(e){}}state.tab='today';ensureWeather();render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('service-worker.js').catch(()=>{})})();
</script>
